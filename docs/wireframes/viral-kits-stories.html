<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Mobile: 24 Luxury Story Templates (Final Edition) - InviteEventAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;500;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #C5A059;
            --gold-dark: #8E6F3E;
            --champagne: #F5F1ED;
            --charcoal: #1A1A1A;
            --bg-dark: #0F0F0F;
            --glass-white: rgba(255, 255, 255, 0.15);
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container */
        .mobile-shell {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 45px;
            border: 12px solid #222;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 50px 150px rgba(0,0,0,0.9);
        }

        /* Top Bar */
        .top-bar {
            padding: 25px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .close-btn {
            width: 35px;
            height: 35px;
            background: var(--glass-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .step-indicator {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold-primary);
            font-weight: 800;
        }

        /* Preview Canvas */
        .story-preview {
            flex: 1;
            position: relative;
            margin: 15px;
            border-radius: 25px;
            overflow: hidden;
            background: #111;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .guest-photo-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .guest-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .overlay-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Legibility Shadows */
        .shd-heavy { text-shadow: 0 4px 15px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.8); }
        .shd-light { text-shadow: 0 2px 8px rgba(0,0,0,0.6); }

        /* --- TEMPLATES --- */

        /* 1. Classic */
        .preview-classic .overlay-container { justify-content: flex-end; align-items: center; padding-bottom: 60px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 40%); }
        .preview-classic h3 { font-family: 'Playfair Display', serif; font-size: 28px; margin: 0; color: var(--champagne); }
        .preview-classic p { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 5px; color: var(--gold-primary); margin-top: 8px; }

        /* 2. Polaroid - FIX: Text below photo */
        .preview-polaroid { background: #FFF !important; padding: 20px 20px 130px 20px !important; }
        .preview-polaroid .guest-photo-container { inset: 20px 20px 130px 20px; }
        .preview-polaroid .overlay-container { justify-content: flex-end; padding-bottom: 35px; align-items: center; }
        .preview-polaroid h3 { font-family: 'Great Vibes', cursive; font-size: 36px; color: #333; margin: 0; }
        .preview-polaroid p { font-family: 'Outfit', sans-serif; font-size: 11px; color: #999; letter-spacing: 2px; }

        /* 3. Golden - FIX: Intense Shadow */
        .preview-golden .overlay-container { justify-content: center; align-items: center; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4)); }
        .preview-golden h3 { font-family: 'Playfair Display', serif; font-size: 42px; font-style: italic; background: linear-gradient(to bottom, #C5A059, #FFF, #8E6F3E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; filter: drop-shadow(0 8px 12px rgba(0,0,0,1)); }
        .preview-golden p { border-top: 1px solid var(--gold-primary); padding-top: 15px; margin-top: 15px; font-size: 12px; color: var(--gold-primary); letter-spacing: 4px; text-shadow: 0 4px 10px #000; }

        /* 4. Minimal - FIX: Spacing Left */
        .preview-minimal .overlay-container { justify-content: flex-end; padding: 60px 40px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 40%); }
        .preview-minimal h3 { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 24px; letter-spacing: 4px; color: white; margin: 0; text-align: left; width: 100%; }
        .preview-minimal p { font-size: 11px; color: var(--gold-primary); letter-spacing: 3px; font-weight: 600; margin-top: 10px; text-align: left; width: 100%; }

        /* 5. Revista - FIX: Position & Visibility */
        .preview-magazine .overlay-container { padding: 40px; justify-content: space-between; align-items: flex-start; }
        .preview-magazine .mag-header { width: 100%; border-bottom: 3px solid white; padding-bottom: 10px; }
        .preview-magazine .mag-header h2 { font-family: 'Cinzel', serif; font-size: 32px; letter-spacing: 10px; margin: 0; text-align: center; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .preview-magazine .mag-footer { width: 100%; margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; }
        .preview-magazine h3 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 22px; color: white; margin: 0; text-shadow: 0 4px 15px #000; }
        .preview-magazine p { font-size: 12px; color: var(--gold-primary); text-transform: uppercase; font-weight: 700; margin-top: 5px; text-shadow: 0 2px 10px #000; }

        /* 6. Floral - FIX: Corner alignment */
        .preview-floral .overlay-container { justify-content: center; align-items: center; text-align: center; }
        .preview-floral .floral-icon { position: absolute; font-size: 80px; color: var(--gold-primary); opacity: 0.8; filter: drop-shadow(0 4px 15px #000); }
        .preview-floral .f-top { top: 30px; left: 30px; }
        .preview-floral .f-bottom { bottom: 30px; right: 30px; transform: rotate(180deg); }
        .preview-floral h3 { font-family: 'Great Vibes', cursive; font-size: 46px; color: white; text-shadow: 0 4px 20px #000; margin: 0; }
        .preview-floral p { font-size: 12px; color: var(--gold-primary); letter-spacing: 3px; margin-top: 5px; text-shadow: 0 2px 10px #000; }

        /* 7. Gatsby - FIX: Contrast & Layout */
        .preview-gatsby::before { content: ''; position: absolute; inset: 25px; border: 2px solid var(--gold-primary); outline: 8px solid var(--gold-primary); outline-offset: -14px; z-index: 5; pointer-events: none; }
        .preview-gatsby .overlay-container { justify-content: center; align-items: center; background: rgba(0,0,0,0.4); }
        .preview-gatsby h3 { font-family: 'Cinzel', serif; font-size: 28px; color: var(--gold-primary); letter-spacing: 8px; text-align: center; margin: 0; text-shadow: 0 0 20px #000; }
        .preview-gatsby p { font-size: 12px; color: white; letter-spacing: 4px; margin-top: 20px; }

        /* 8. Neon - FIX: Redesign */
        .preview-party .overlay-container { justify-content: flex-end; align-items: flex-start; padding: 60px 40px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .preview-party h3 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 38px; color: white; text-shadow: 0 0 10px var(--gold-primary), 0 0 25px var(--gold-primary); margin: 0; }
        .preview-party p { font-size: 14px; font-weight: 600; color: white; letter-spacing: 3px; opacity: 0.8; margin-top: 10px; }

        /* 9. Retro - FIX: Visual sense */
        .preview-retro .guest-photo { filter: sepia(0.4) contrast(1.2); }
        .preview-retro .overlay-container { justify-content: space-between; padding: 40px; }
        .preview-retro .stamp { font-family: 'Courier New', monospace; font-size: 24px; color: #FF8C00; font-weight: 900; background: rgba(0,0,0,0.5); padding: 5px 15px; align-self: flex-start; }
        .preview-retro .info { align-self: flex-end; text-align: right; }
        .preview-retro h3 { font-family: 'Outfit', sans-serif; font-size: 16px; color: white; margin: 0; text-shadow: 0 2px 5px #000; }

        /* 10. Initials - FIX: Positioning */
        .preview-initials .overlay-container { justify-content: center; align-items: center; }
        .preview-initials .big-char { position: absolute; font-size: 260px; font-family: 'Playfair Display', serif; color: white; opacity: 0.15; z-index: -1; font-weight: 900; }
        .preview-initials h3 { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 20px; letter-spacing: 8px; color: white; text-shadow: 0 4px 15px #000; }

        /* 11. Frame - FIX: Redesign */
        .preview-frame { padding: 40px !important; }
        .preview-frame::before { content: ''; position: absolute; inset: 20px; border: 2px solid var(--gold-primary); z-index: 5; }
        .preview-frame::after { content: ''; position: absolute; inset: 30px; border: 1px solid var(--gold-primary); z-index: 5; }
        .preview-frame .overlay-container { justify-content: flex-end; align-items: center; padding-bottom: 20px; }
        .preview-frame .tag { background: var(--gold-primary); color: #000; padding: 10px 30px; font-weight: 800; font-size: 14px; font-family: 'Playfair Display', serif; }

        /* 12. Split - FIX: Layout */
        .preview-split .guest-photo-container { width: 45%; left: 0; border-right: 2px solid var(--gold-primary); }
        .preview-split .overlay-container { left: 45%; width: 55%; background: var(--charcoal); justify-content: center; padding: 30px; align-items: flex-start; }
        .preview-split h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold-primary); margin: 0; line-height: 1.2; }
        .preview-split p { font-size: 11px; color: #888; margin-top: 30px; letter-spacing: 2px; }

        /* 13. Diamond - KEEP AS IS */
        .preview-diamond .overlay-container { justify-content: center; align-items: center; }
        .preview-diamond .d-box { width: 240px; height: 240px; border: 2px solid var(--gold-primary); transform: rotate(45deg); display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        .preview-diamond h3 { transform: rotate(-45deg); font-family: 'Playfair Display', serif; font-size: 24px; color: white; text-align: center; margin: 0; }

        /* 14. Zen - KEEP AS IS */
        .preview-zen .overlay-container { justify-content: center; align-items: center; }
        .preview-zen .z-circle { width: 280px; height: 280px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .preview-zen h3 { font-family: 'Outfit', sans-serif; font-weight: 200; font-size: 20px; letter-spacing: 6px; color: white; }

        /* 15. Chateau (Unique) */
        .preview-chateau .overlay-container { padding: 60px 40px; justify-content: flex-start; align-items: center; }
        .preview-chateau .arch { width: 100%; border: 2px solid var(--gold-primary); border-bottom: none; height: 100px; border-radius: 100px 100px 0 0; margin-bottom: 20px; }
        .preview-chateau h3 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold-primary); text-shadow: 0 2px 10px #000; }

        /* 16. Stardust (Unique) */
        .preview-stardust::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, white 1px, transparent 1px); background-size: 20px 20px; opacity: 0.2; z-index: 5; }
        .preview-stardust .overlay-container { justify-content: center; align-items: center; }
        .preview-stardust h3 { font-family: 'Great Vibes', cursive; font-size: 52px; color: white; text-shadow: 0 0 30px var(--gold-primary); }

        /* 17. Mono (High Fashion) */
        .preview-mono .overlay-content { background: #000; }
        .preview-mono .overlay-container { justify-content: center; align-items: center; background: rgba(0,0,0,0.5); }
        .preview-mono h3 { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 900; color: white; opacity: 0.9; margin: 0; }

        /* 18. Sunset (Unique) */
        .preview-sunset .guest-photo { filter: brightness(0.7) sepia(0.3) hue-rotate(-30deg); }
        .preview-sunset .overlay-container { justify-content: flex-end; padding: 60px; background: linear-gradient(to top, rgba(255, 69, 0, 0.4), transparent); }
        .preview-sunset h3 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 32px; letter-spacing: -1px; color: #FFF; }

        /* 19. Vineyard (Unique) */
        .preview-vineyard .overlay-container { justify-content: center; align-items: center; padding: 40px; }
        .preview-vineyard .v-frame { border: 1px solid rgba(255,255,255,0.3); padding: 40px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .preview-vineyard h3 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 28px; color: var(--champagne); }

        /* 20. Symphony */
        .preview-symphony .overlay-container { justify-content: center; padding: 60px; }
        .preview-symphony .line { width: 100%; height: 2px; background: var(--gold-primary); margin: 15px 0; }
        .preview-symphony h3 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 10px; color: white; }

        /* 21. Champagne */
        .preview-champagne .overlay-container { justify-content: center; align-items: center; }
        .preview-champagne h3 { font-family: 'Great Vibes', cursive; font-size: 64px; color: var(--gold-primary); text-shadow: 0 0 40px rgba(197, 160, 89, 0.6); }

        /* 22. Lace */
        .preview-lace .overlay-container { justify-content: center; align-items: center; }
        .preview-lace .inner-frame { border: 10px double var(--gold-primary); padding: 40px; width: 200px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .preview-lace h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: white; text-align: center; }

        /* 23. Minimal Alt */
        .preview-minimal-alt .overlay-container { justify-content: flex-start; padding: 80px 40px; }
        .preview-minimal-alt h3 { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 18px; letter-spacing: 10px; border-bottom: 1px solid white; padding-bottom: 20px; width: 100%; }

        /* 24. Luxury */
        .preview-luxury .overlay-container { justify-content: center; align-items: center; }
        .preview-luxury h3 { font-family: 'Cinzel', serif; font-size: 32px; background: linear-gradient(45deg, #B8860B, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; filter: drop-shadow(0 4px 10px #000); }

        /* Bottom Controls */
        .bottom-panel { background: #000; padding: 10px 20px 40px; z-index: 200; }
        .template-selector { display: flex; gap: 14px; overflow-x: auto; padding: 15px 0 25px; scrollbar-width: none; }
        .template-selector::-webkit-scrollbar { display: none; }

        .template-item {
            min-width: 85px;
            height: 110px;
            border-radius: 20px;
            border: 2px solid #222;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            gap: 12px;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.3s;
            color: #555;
            text-transform: uppercase;
            font-weight: 600;
        }

        .template-item.active { border-color: var(--gold-primary); background: rgba(197, 160, 89, 0.1); color: var(--gold-primary); transform: translateY(-5px); }
        .template-item svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.2; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 12px; margin-top: 10px; }
        .btn-main { flex: 1; background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); color: white; padding: 22px; border-radius: 20px; font-weight: 800; border: none; cursor: pointer; font-size: 14px; letter-spacing: 1px; }
        .btn-capture { width: 70px; background: #222; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 1px solid #444; cursor: pointer; color: white; }
        .btn-capture svg { width: 30px; height: 30px; }

        /* Branding / Watermark */
        .brand-subtle { 
            position: absolute; 
            top: 35px; 
            right: 35px; 
            font-size: 7px; 
            letter-spacing: 2px; 
            z-index: 100; 
            font-weight: 700;
            background: rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.8);
            padding: 5px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="mobile-shell">
        <div class="top-bar">
            <div class="close-btn">×</div>
            <div class="step-indicator">Criar Story</div>
            <div style="width: 35px;"></div>
        </div>

        <div class="story-preview preview-classic" id="storyPreview">
            <div class="guest-photo-container">
                <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&q=80&w=1000" class="guest-photo" id="mainPhoto">
            </div>
            <div class="brand-subtle">InviteEvent.ai</div>
            <div class="overlay-container" id="overlay">
                <!-- Content injected via JS -->
                <h3>Ana & Pedro</h3>
                <p>12 . 10 . 2026</p>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="template-selector" id="templateSelector">
                <!-- 24 High Quality Templates with Correct Icons -->
                <div class="template-item active" data-template="classic">
                    <svg viewBox="0 0 24 24"><path d="M3 21h18M3 7v10M21 7v10M3 7l9-4 9 4"/></svg><span>Classic</span>
                </div>
                <div class="template-item" data-template="polaroid">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 18h18"/></svg><span>Polaroid</span>
                </div>
                <div class="template-item" data-template="golden">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6z"/></svg><span>Golden</span>
                </div>
                <div class="template-item" data-template="minimal">
                    <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 9h6v6H9z"/></svg><span>Minimal</span>
                </div>
                <div class="template-item" data-template="magazine">
                    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 7H20"/></svg><span>Revista</span>
                </div>
                <div class="template-item" data-template="floral">
                    <svg viewBox="0 0 24 24"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Floral</span>
                </div>
                <div class="template-item" data-template="gatsby">
                    <svg viewBox="0 0 24 24"><path d="M2 7l10-5 10 5-10 5zM2 17l10-5 10 5-10 5z"/></svg><span>Gatsby</span>
                </div>
                <div class="template-item" data-template="party">
                    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Neon</span>
                </div>
                <div class="template-item" data-template="retro">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20"/></svg><span>Retro</span>
                </div>
                <div class="template-item" data-template="initials">
                    <svg viewBox="0 0 24 24"><path d="M4 20l4-12 4 12M4 14h8"/></svg><span>Initials</span>
                </div>
                <div class="template-item" data-template="frame">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 14l5-5 10 10"/></svg><span>Frame</span>
                </div>
                <div class="template-item" data-template="split">
                    <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg><span>Split</span>
                </div>
                <div class="template-item" data-template="diamond">
                    <svg viewBox="0 0 24 24"><path d="M12 2l10 10-10 10-10-10z"/></svg><span>Diamond</span>
                </div>
                <div class="template-item" data-template="zen">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg><span>Zen</span>
                </div>
                <div class="template-item" data-template="chateau">
                    <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg><span>Chateau</span>
                </div>
                <div class="template-item" data-template="stardust">
                    <svg viewBox="0 0 24 24"><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M19 5l-2 2M7 17l-2 2M19 19l-2-2M7 7L5 5"/></svg><span>Stardust</span>
                </div>
                <div class="template-item" data-template="mono">
                    <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3L3 21"/></svg><span>Mono</span>
                </div>
                <div class="template-item" data-template="sunset">
                    <svg viewBox="0 0 24 24"><path d="M12 2v2M4.9 4.9l1.4 1.4M2 12h2M4.9 19.1l1.4-1.4M12 20v2M17.7 17.7l1.4 1.4M22 12h-2M17.7 6.3l1.4-1.4"/></svg><span>Sunset</span>
                </div>
                <div class="template-item" data-template="vineyard">
                    <svg viewBox="0 0 24 24"><path d="M12 2L4 7v10l8 5 8-5V7z"/></svg><span>Vineyard</span>
                </div>
                <div class="template-item" data-template="symphony">
                    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 10l12-2"/></svg><span>Symphony</span>
                </div>
                <div class="template-item" data-template="champagne">
                    <svg viewBox="0 0 24 24"><path d="M18 3H6L8 15h8zM12 15v7M8 21h8"/></svg><span>Cheers</span>
                </div>
                <div class="template-item" data-template="lace">
                    <svg viewBox="0 0 24 24"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/></svg><span>Lace</span>
                </div>
                <div class="template-item" data-template="minimal-alt">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Clean</span>
                </div>
                <div class="template-item" data-template="luxury">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5zM2 17l10 5 10-5"/></svg><span>Luxury</span>
                </div>
            </div>

            <div class="action-btns">
                <div class="btn-capture" onclick="document.getElementById('fileInput').click()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFile(this)">
                </div>
                <button class="btn-main">SALVAR STORY ✨</button>
            </div>
        </div>
    </div>

    <script>
        const preview = document.getElementById('storyPreview');
        const overlay = document.getElementById('overlay');
        const items = document.querySelectorAll('.template-item');
        const mainPhoto = document.getElementById('mainPhoto');

        // Adiciona suporte a vídeo
        const videoElement = document.createElement('video');
        videoElement.className = 'guest-photo';
        videoElement.style.display = 'none';
        videoElement.autoplay = true;
        videoElement.loop = true;
        videoElement.muted = true;
        videoElement.playsInline = true;
        document.querySelector('.guest-photo-container').appendChild(videoElement);

        const templatesData = {
            classic: '<h3 class="shd">Ana & Pedro</h3><p class="shd">12 . 10 . 2026</p>',
            polaroid: '<h3>Ana & Pedro</h3><p>12 DE OUTUBRO DE 2026</p>',
            golden: '<h3>Ana & Pedro</h3><p>12 . 10 . 2026</p>',
            minimal: '<h3>Ana & Pedro</h3><p>PARA SEMPRE JUNTOS</p>',
            magazine: '<div class="mag-header"><h2>CASAMENTO</h2></div><div class="mag-footer"><h3>Ana & Pedro</h3><p>Edição Especial de Luxo</p></div>',
            floral: '<div class="floral-icon f-top">✿</div><div class="floral-icon f-bottom">✿</div><h3>Ana & Pedro</h3><p>12 . 10 . 2026</p>',
            gatsby: '<h3>ANA & PEDRO</h3><p>12 OUT 2026</p>',
            party: '<h3>ANA & PEDRO</h3><p>NOITE INESQUECÍVEL</p>',
            retro: '<div class="stamp">OUT 12 26</div><div class="info"><h3>Ana & Pedro</h3></div>',
            initials: '<div class="big-char">A&P</div><h3>ANA & PEDRO</h3>',
            frame: '<div class="tag">Ana & Pedro</div>',
            split: '<h3>Ana<br>&<br>Pedro</h3><p>12 de Outubro de 2026</p>',
            diamond: '<div class="d-box"><h3>Ana & Pedro</h3></div>',
            zen: '<div class="z-circle"><h3>Ana & Pedro</h3></div>',
            chateau: '<div class="arch"></div><h3>Ana & Pedro</h3>',
            stardust: '<h3>Ana & Pedro</h3>',
            mono: '<h3>A&P</h3>',
            sunset: '<h3>FIM DE TARDE</h3>',
            vineyard: '<div class="v-frame"><h3>Ana & Pedro</h3></div>',
            symphony: '<h3>Ana & Pedro</h3><div class="line"></div>',
            champagne: '<h3>UM BRINDE!</h3>',
            lace: '<div class="inner-frame"><h3>Ana & Pedro</h3></div>',
            'minimal-alt': '<h3>Ana & Pedro</h3>',
            luxury: '<h3>Ana & Pedro</h3>'
        };

        items.forEach(item => {
            item.addEventListener('click', () => {
                items.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const template = item.getAttribute('data-template');
                preview.className = 'story-preview preview-' + template;
                overlay.innerHTML = templatesData[template];
            });
        });

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const fileURL = URL.createObjectURL(file);
                
                if (file.type.startsWith('video/')) {
                    mainPhoto.style.display = 'none';
                    videoElement.style.display = 'block';
                    videoElement.src = fileURL;
                } else {
                    videoElement.style.display = 'none';
                    mainPhoto.style.display = 'block';
                    mainPhoto.src = fileURL;
                    mainPhoto.style.opacity = '1';
                }
            }
        }

        // Script para salvar a imagem/video localmente
        // Incluindo html2canvas dinamicamente
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);

        document.querySelector('.btn-main').addEventListener('click', async function() {
            if (!window.html2canvas) {
                alert('Aguarde o carregamento do motor de renderização...');
                return;
            }

            const isVideo = videoElement.style.display === 'block';
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'GERANDO STORY... ⏳';
            btn.style.opacity = '0.7';

            try {
                // Preparar o container para renderização (remover bordas arredondadas e forçar 9:16)
                const originalRadius = preview.style.borderRadius;
                preview.style.borderRadius = '0px';

                // Calcula a escala para resultar em 1080 de largura (1080x1920 para IG Stories)
                const targetWidth = 1080;
                const scale = targetWidth / preview.offsetWidth;

                // Para vídeos, precisamos garantir que o frame atual seja renderizado
                // html2canvas não suporta tag <video> nativamente de forma confiavél, 
                // então desenhamos o frame atual em um canvas oculto que substitui a imagem temporariamente
                let tempCanvas;
                let originalMainPhotoDisplay = mainPhoto.style.display;
                
                if (isVideo) {
                    tempCanvas = document.createElement('canvas');
                    tempCanvas.width = videoElement.videoWidth;
                    tempCanvas.height = videoElement.videoHeight;
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(videoElement, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    mainPhoto.src = tempCanvas.toDataURL();
                    mainPhoto.style.display = 'block';
                    videoElement.style.display = 'none';
                }

                const canvas = await html2canvas(preview, {
                    scale: scale,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#111'
                });

                // Restaurar estado
                preview.style.borderRadius = originalRadius;
                if (isVideo) {
                    mainPhoto.style.display = originalMainPhotoDisplay;
                    videoElement.style.display = 'block';
                    // Nota: Para gerar um arquivo MP4 real localmente no frontend seria necessário MediaRecorder + Canvas em loop.
                    // Para fins deste wireframe funcional, renderizamos o frame atual do vídeo com overlay como uma imagem estática de alta qualidade,
                    // que é o padrão de fallback para Stories estáticos.
                }

                // Baixar arquivo gerado no formato correto (1080x1920 aprox dependendo do aspect ratio real, 
                // mas a largura é garantida 1080px)
                const dataURL = canvas.toDataURL('image/jpeg', 0.95);
                const a = document.createElement('a');
                a.href = dataURL;
                a.download = isVideo ? 'story-frame-invite-event.jpg' : 'story-invite-event.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                btn.innerHTML = 'SALVO COM SUCESSO ✔️';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                }, 3000);

            } catch (error) {
                console.error('Erro ao gerar Story:', error);
                btn.innerHTML = 'ERRO AO SALVAR ❌';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                }, 3000);
            }
        });
    </script>
</body>
</html>
