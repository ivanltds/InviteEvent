<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Digital - Animação Majestosa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; background-color: #F9F9FB; color: #1A1A1A; overflow: hidden; }
        
        .scene {
            position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #F9F9FB 0%, #E5E5E5 100%);
            perspective: 1200px;
        }

        .envelope-wrapper {
            position: relative; width: 340px; height: 230px; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        .envelope-back {
            position: absolute; inset: 0; background: #E5E5E5; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 0;
        }

        .envelope-front {
            position: absolute; inset: 0; background: #F4F4F5; z-index: 3; border-radius: 8px;
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 60%, 0 0);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .envelope-top-flap {
            position: absolute; inset: -1px; background: #FFFFFF; z-index: 4; border-radius: 8px;
            clip-path: polygon(0 0, 100% 0, 50% 60%);
            transform-origin: top; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.2s;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05));
            will-change: transform;
        }

        .seal {
            position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%);
            width: 70px; height: 70px; background: #C5A059; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #FFF; font-family: 'Playfair Display', serif; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; z-index: 5;
        }

        .seal:hover { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 6px 20px rgba(197, 160, 89, 0.6); }

        .dummy-card {
            position: absolute; left: 10px; right: 10px; bottom: 10px; top: 10px; background: #FFFFFF; border-radius: 12px; z-index: 2; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #EAEAEA; will-change: transform;
        }

        /* Hero Image Placeholder with Shimmer */
        .hero-img {
            width: 100%; height: 220px; background-color: #EAEAEA; position: relative; overflow: hidden; background-position: center; background-size: cover; transition: opacity 0.5s ease;
        }
        
        .hero-img::after {
            content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmer 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%);
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .hero-img.loaded::after { display: none; }

        .card-content {
            padding: 40px 30px; text-align: center; display: flex; flex-direction: column; align-items: center; flex: 1; background: #FFFFFF;
        }

        .msg { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); will-change: opacity, transform; }

        .title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 15px; color: #1A1A1A; }
        .subtitle { font-size: 15px; color: #71717A; margin-bottom: 40px; line-height: 1.6; max-width: 280px; }
        .intro { font-size: 13px; color: #C5A059; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 15px; font-weight: 600; }

        .btn-signature {
            background-color: #C5A059; color: #FFFFFF; border: none; padding: 16px 36px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: auto; width: 100%; max-width: 250px;
        }
        .btn-signature:hover { background-color: #B38F48; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(197, 160, 89, 0.3); }

        /* Animation States Sequence */
        
        /* Step 1: Open Flap */
        .is-step-1 .envelope-top-flap { transform: rotateX(180deg); z-index: 1; }
        .is-step-1 .seal { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        
        /* Step 2: Pull Dummy Card */
        .is-step-2 .dummy-card { transform: translateY(-140px); }

        /* Focus Container for the Real Card */
        .focus-container {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10;
        }
        .full-card {
            width: 90%; max-width: 420px; height: 70vh; background: #FFF; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; opacity: 0; transform: translateY(60px) scale(0.9); transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1), filter 1.2s ease; overflow: hidden; pointer-events: none; will-change: transform, opacity, width, height, max-width, border-radius, filter; filter: blur(10px);
        }
        
        /* Step 3: Envelope fades, Full Card assumes position */
        .is-step-3 .envelope-wrapper { opacity: 0; transform: scale(0.85) translateY(50px); pointer-events: none; filter: blur(5px); }
        .is-step-3 .full-card { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; filter: blur(0); }
        
        /* Step 4: Show Messages sequentially */
        .is-step-4 .msg { opacity: 1; transform: translateY(0); }

        /* Step 5: Expand to full screen with blur transition */
        .is-step-5 .full-card {
            width: 100vw; max-width: 100vw; height: 100vh; border-radius: 0; box-shadow: none;
            animation: expandBlur 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes expandBlur {
            0% { filter: blur(0); }
            40% { filter: blur(8px); }
            100% { filter: blur(0); }
        }

        /* Staggered Delays for text */
        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }
        .delay-3 { transition-delay: 0.6s; }
        .delay-4 { transition-delay: 0.8s; }

    </style>
</head>
<body>
    <div class="scene" id="scene">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-back"></div>
            <!-- Dummy card for sliding out illusion -->
            <div class="dummy-card"></div>
            <div class="envelope-front"></div>
            <div class="envelope-top-flap"></div>
            <div class="seal" onclick="openEnvelope()">M&J</div>
        </div>
    </div>

    <!-- The actual content card that scales up -->
    <div class="focus-container">
        <div class="full-card" id="fullCard">
            <!-- Hero Image with Shimmer loading state -->
            <div class="hero-img" id="heroImage"></div>
            <div class="card-content">
                <p class="msg delay-1 intro">Com muita alegria</p>
                <h1 class="msg delay-2 title">Maria & João</h1>
                <p class="msg delay-3 subtitle">Convidam você para celebrar o início de um novo capítulo em nossas vidas. Sua presença é nosso maior presente.</p>
                <button class="msg delay-4 btn-signature" style="margin-bottom: 20px;">Confirmar Presença</button>
                <div class="msg delay-4 page-hint" style="font-size: 11px; color: #A0A0A0; margin-top: auto; transition: opacity 1s;">
                    (O convite se expandirá para a página real...)
                </div>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const body = document.body;
            
            // 0. Pre-load real heavy image (Hero)
            // Isso garante que não tenha engasgo ou layout shift.
            const img = new Image();
            img.src = 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=800';

            // 1. Abre a aba do envelope
            body.classList.add('is-step-1');
            
            // 2. Puxa o convite para fora
            setTimeout(() => {
                body.classList.add('is-step-2');
            }, 600);

            // 3. O envelope some e o card real assume a tela (efeito Morph)
            setTimeout(() => {
                body.classList.add('is-step-3');
            }, 1400);

            // 4. Revela os textos suavemente (Staggered) e injeta a imagem quando pronta
            setTimeout(() => {
                body.classList.add('is-step-4');
                
                // Injeta imagem do Hero garantindo que esteja carregada
                const heroDiv = document.getElementById('heroImage');
                img.onload = () => {
                   heroDiv.style.backgroundImage = `url(${img.src})`;
                   heroDiv.classList.add('loaded'); // Remove o shimmer
                };
                // Se já estiver no cache, executa instantaneamente
                if(img.complete) img.onload();
                
            }, 2000); 

            // 5. Expande para tela cheia (100vw/100vh) transformando-se na página real com Blur
            setTimeout(() => {
                body.classList.add('is-step-5');
                // Esconde a dica após expandir
                const hint = document.querySelector('.page-hint');
                if(hint) hint.style.opacity = '0';
            }, 4500);
        }
    </script>
</body>
</html>
