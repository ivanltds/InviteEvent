<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Lista de Presentes - InviteEventAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
        .gold-button { background: #D4AF37; color: white; padding: 10px; border-radius: 8px; font-weight: 600; width: 100%; }
        .gift-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #E2E8F0; }
    </style>
</head>
<body class="max-w-4xl mx-auto p-6">
    <header class="text-center my-12">
        <h1 class="text-4xl font-bold mb-4">Nossa Lista de Presentes</h1>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="gift-card">
            <div class="h-48 bg-gray-200 flex items-center justify-center">Imagem</div>
            <div class="p-4">
                <h3 class="text-xl mb-1">Cota de Lua de Mel</h3>
                <p class="font-bold text-lg">R$ 350,00</p>
                <button class="gold-button mt-4">Presentear</button>
            </div>
        </div>
    </div>
</body>
</html>
