<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - RSVP Flow - InviteEventAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .gold-button { background: #D4AF37; color: white; padding: 16px; border-radius: 12px; font-weight: 600; width: 100%; }
        .guest-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #E2E8F0; margin-bottom: 12px; }
        .toggle-active { background: #D4AF37; color: white; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col">
    <!-- Hero Image Placeholder -->
    <div class="h-64 bg-gray-300 relative">
        <div class="absolute inset-0 bg-black opacity-30"></div>
        <div class="absolute bottom-6 left-6 text-white">
            <h1 class="text-3xl">Maria & João</h1>
            <p class="text-sm opacity-90">15 de Outubro de 2024</p>
        </div>
    </div>

    <main class="p-6 flex-grow">
        <h2 class="text-2xl mb-2">Confirmar Presença</h2>
        <p class="text-gray-500 mb-8">Por favor, confirme quem poderá comparecer ao nosso grande dia.</p>

        <div class="space-y-4">
            <!-- Member 1 -->
            <div class="guest-card flex justify-between items-center">
                <div>
                    <p class="font-bold text-lg">Ricardo Silva</p>
                </div>
                <div class="flex gap-2">
                    <button class="px-4 py-2 border rounded-lg text-sm font-semibold toggle-active">Vou</button>
                    <button class="px-4 py-2 border rounded-lg text-sm font-semibold text-gray-400">Não vou</button>
                </div>
            </div>

            <!-- Member 2 -->
            <div class="guest-card flex justify-between items-center">
                <div>
                    <p class="font-bold text-lg">Ana Paula Silva</p>
                </div>
                <div class="flex gap-2">
                    <button class="px-4 py-2 border rounded-lg text-sm font-semibold text-gray-400">Vou</button>
                    <button class="px-4 py-2 border rounded-lg text-sm font-semibold border-red-200 text-red-500 bg-red-50">Não vou</button>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Restrições Alimentares ou Observações</label>
            <textarea class="w-full border rounded-xl p-4 h-24 focus:ring-2 focus:ring-gold-500 outline-none" placeholder="Ex: Alérgico a camarão..."></textarea>
        </div>
    </main>

    <footer class="p-6 bg-white border-t sticky bottom-0">
        <button class="gold-button shadow-lg">Salvar Confirmação</button>
    </footer>
</body>
</html>
